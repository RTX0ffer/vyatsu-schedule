name: Update Schedule

on:
  schedule:
    # Запуск каждую полночь по МСК / Кирову (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch: # Возможность запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run schedule parser
        run: python make_ics.py

      - name: Commit and push changes
        id: git_push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vyatsu*.ics lessons_cache.json

          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Изменений в расписании нет."
          else
            git commit -m "Auto-update schedule: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Расписание успешно обновлено и закоммичено."
          fi

      - name: Send Telegram Notification
        if: steps.git_push.outputs.has_changes == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="📅 *Расписание ВятГУ обновлено!*%0AВыгружены новые пары или правки на сайте."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
